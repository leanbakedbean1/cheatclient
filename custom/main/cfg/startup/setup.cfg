// Here replace all binds to your liking, leaving it blank will disable it if you wish to not use that bind.

// demos
bind "" "demosave"
bind "" "demoreset"

// viewmodel fov
bind "" "upfov"
bind "" "downfov"
bind "" "toggleminviewmodels"
bind "" "toggleviewmodel"

// netgraph
bind "" "toggle_netgraph" // toggles netgraph on and off with tab showing netgraph or scoreboard accordingly
bind "" "net_graph_pos" // cycles through netgraph positions

// fakelag
bind "" "fakelagcycle"
bind "" "resetfakelag"
bind "" "toggle_lag"
bind "" "+lag_on"
bind "" "+peek_desync"

// movement
bind "" "+ljhold"
bind "" "+mjhold"
bind "" "+align" 
bind "" "ctap"
bind "" "+duck"
bind "" "+jump" // specificly for mwheel jump binds

// disguises
bind "" "disguise 8 -2" // undiguise
bind "" "disguise 1 -1" // scout
bind "" "disguise 5 -1" // medic
bind "" "disguise 8 -1" // spy

// item presets
bind "" "load_itempreset 1" // preset 1
bind "" "load_itempreset 2" // preset 2
bind "" "load_itempreset 3" // preset 3
bind "" "load_itempreset 4" // preset 4

// other
bind "" "lodtweakstoggle" // toggle lod tweaks

// menu
bind "`" "cheatmenu"

// settings
hud_fastswitch 1

// startup aliases
// these presets are (remove the '//' in front of the line to enable them):
// mcomsverylow // mastercoms very low preset
mcomslow // mastercoms low preset
// mcomsmedium // mastercoms medium preset
// mcomsmediumlow // mastercoms medium low preset
// mcomsmediumhigh // mastercoms medium high preset
// mcomshigh // mastercoms high preset
// mcomsultra // mastercoms ultra preset
// xcdgfx // xcd gfx preset
// maplegfx // maple gfx preset
// gfx // klowns gfx presets
// cinema // boobsys demo recording gfx preset