// demos
ds_autodelete 1 // automatically delete .dem files with no bookmarmks or killstreak events
ds_enable 2 // auto-record all matches
ds_kill_delay 1 // maximum time between kills for tracking kill streaks
ds_min_streak 999 // minimum kill streak count before being recorded => 999 kills in 1 second is impossible, meaning the demo will only get automatically deleted if there is no bookmark
ds_log 1 // log kill streak and bookmark events to an associated .txt file, without this set to 1, demos wont save
ds_notify 0 // text output when recording start/stop/bookmark events : 0 - console, 1 - console and chat, 2 - console and HUD.

alias demosave "ds_mark clip;wait 1;ds_stop;wait 1;ds_record"
alias demoreset "ds_stop;wait 1;ds_record"