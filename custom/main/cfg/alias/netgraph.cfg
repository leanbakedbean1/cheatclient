clear
// Net graph
echo "Netgraph aliases:"
alias "+tabgraph" "+showscores; net_graph 3"
alias "-tabgraph" "-showscores; net_graph 0"
alias "+tabgraph1" "+showscores; net_graph 3"
alias "-tabgraph1" "-showscores; net_graph 1"
alias "toggle_netgraph" "toggle_netgraph_on"; echo "type toggle_netgraph to toggle netgraph on and off with tab showing netgraph or scoreboard accordingly"
alias "toggle_netgraph_off" "net_graph 0; bind tab +showscores; alias toggle_netgraph toggle_netgraph_tablist"; echo "type toggle_netgraph_off to turn netgraph off"
alias "toggle_netgraph_tablist" "net_graph 0; bind tab +tabgraph1; alias toggle_netgraph toggle_netgraph_on"; echo "type toggle_netgraph_tablist to turn netgraph on and bind tab to show scoreboard"
alias "toggle_netgraph_on" "net_graph 1; bind tab +tabgraph; alias toggle_netgraph toggle_netgraph_off"; echo "type toggle_netgraph_on to turn netgraph on and bind tab to show scoreboard"
alias "net_graph_pos_1" "net_graphpos 1; net_graphproportionalfont 0;alias net_graph_pos net_graph_pos_2"; echo "type net_graph_pos_1 to set netgraph position to the right"
alias "net_graph_pos_2" "net_graphpos 2; net_graphproportionalfont 0; alias net_graph_pos net_graph_pos_3"; echo "type net_graph_pos_2 to set netgraph position to the center"
alias "net_graph_pos_3" "net_graphpos 3; net_graphproportionalfont 0; alias net_graph_pos net_graph_pos_1"; echo "type net_graph_pos_3 to set netgraph position to the left"
alias "net_graph_pos_4" "net_graphpos 1; net_graphproportionalfont 1; alias net_graph_pos net_graph_pos_5"; echo "type net_graph_pos_4 to set netgraph position to the bottom"
alias "net_graph_pos_5" "net_graphpos 2; net_graphproportionalfont 1; alias net_graph_pos net_graph_pos_6"; echo "type net_graph_pos_5 to set netgraph position to the bottom"
alias "net_graph_pos_6" "net_graphpos 3; net_graphproportionalfont 1; alias net_graph_pos net_graph_pos_1"; echo "type net_graph_pos_6 to set netgraph position to the bottom"

alias "net_graph_pos" "net_graph_pos_1"

echo ""
echo ""

alias "back" "exec alias/menu.cfg"; echo "type back to return to the menu"