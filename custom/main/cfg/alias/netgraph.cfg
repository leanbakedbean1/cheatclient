clear
echo "Net graph aliases:"
// Net graph
echo "Netgraph toggle aliases:"
alias "+tabgraph" "+showscores; net_graph 1"; echo "hold tab to show netgraph and scoreboard"
alias "-tabgraph" "-showscores; net_graph 0"; echo "release tab to hide netgraph and scoreboard"
alias "toggle_netgraph" "toggle_netgraph_on"; echo "type toggle_netgraph to toggle netgraph on and off with tab showing netgraph or scoreboard accordingly"
alias "toggle_netgraph_off" "net_graph 0; bind tab +tabgraph; alias toggle_netgraph toggle_netgraph_on"; echo "type toggle_netgraph to turn netgraph off and bind tab to show netgraph"
alias "toggle_netgraph_on" "net_graph 1; bind tab +showscores; alias toggle_netgraph toggle_netgraph_off"; echo "type toggle_netgraph to turn netgraph on and bind tab to show scoreboard"

echo ""
echo ""

alias "back" "exec alias/menu.cfg"; echo "type back to return to the menu"