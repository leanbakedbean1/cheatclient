clear
echo "Module aliases:"
// Modules
alias "3dmodeloff" "cl_hud_playerclass_use_playermodel 0"; echo "type 3dmodeloff to turn hud playermodel off"
alias "3dmodelon" "cl_hud_playerclass_use_playermodel 1"; echo "type 3dmodelon to turn hud playermodel on"
alias "6svm" "viewmodel_fov 70; tf_use_min_viewmodels 1"; echo "type 6svm to use 6s viewmodel"
alias "ae" "exec misc/ae"; echo "type ae for ragdoll after effects"
alias "bighud" "cl_hud_minmode 0"; echo "type bighud to use hud non-min-mode"
alias "bloat" "exec misc/bloat"; echo "type bloat for hud bloat"
alias "bluroff" "mat_motion_blur_enabled 0"; echo "type bluroff to turn blur off"
alias "bluron" "mat_motion_blur_enabled 1; mat_motion_blur_falling_intensity 0; mat_motion_blur_falling_max 0; mat_motion_blur_falling_min 0; mat_motion_blur_forward_enabled 0 ; mat_motion_blur_percent_of_screen_max 5; mat_motion_blur_rotation_intensity 2; mat_motion_blur_strength 0.75"; echo "type bluron to turn blur on"
alias "chatoff" "hud_saytext_time 0; cl_enable_text_chat 0; cl_showtextmsg 0"; echo "type chatoff to turn chat off"
alias "chaton" "hud_saytext_time 10; cl_enable_text_chat 1; cl_showtextmsg 1"; echo "type chaton to turn chat on"
alias "crouchjump" "exec misc/crouchjump"; echo "type crouchjump for crouch jump script"
alias "filteredtextures" "mat_filtertextures 1; mat_filterlightmaps 1"; echo "type filteredtextures for smooth textures"
alias "fog" "exec misc/fog"; echo "type fog for script fog settings"
alias "gibsoff" "cl_burninggibs 0; props_break_max_pieces 0; tf_playergib 0"; echo "type gibsoff to turn gibs off"
alias "gibson" "cl_burninggibs 1; props_break_max_pieces -1; tf_playergib 1"; echo "type gibson to turn gibs on"
alias "hlvm" "viewmodel_fov 55; tf_use_min_viewmodels 1"; echo "type hlvm to use highlander viewmodel"
alias "killfeedoff" "hud_deathnotice_time 0"; echo "type killfeedoff to turn killfeed off"
alias "killfeedon" "hud_deathnotice_time 5"; echo "type killfeedon to turn killfeed on"
alias "killstreaksoff" "cl_hud_killstreak_display_time 0"; echo "type killstreaksoff to turn killstreaks off"
alias "killstreakson" "cl_hud_killstreak_display_alpha 120; cl_hud_killstreak_display_time 2"; echo "type killstreakson to turn killstreaks on"
alias "lefthand" "cl_flipviewmodels 1"
alias "local" "exec misc/local"; echo "type local for local settings"
alias "lodtweaksoff" "mat_mipmaptextures 0"; echo "type lodtweaksoff to turn lodtweaks off"
alias "lodtweakson" "mat_mipmaptextures 1"; echo "type lodtweakson to turn lodtweaks on"
alias "matchhudoff" "tf_use_match_hud 0"; echo "type matchhudoff to turn match hud off"
alias "matchhudon" "tf_use_match_hud 1"; echo "type matchhudon to turn match hud on"
alias "movementbinds" "exec misc/movementconfig"; echo "type movementbinds for movement binds"
alias "netgraphoff" "net_graph 0"; echo "type netgraphoff to turn netgraph off"
alias "netgraphon" "net_graph 1"; echo "type netgraphon to turn netgraph on"
alias "nobloat" "exec misc/nobloat"; echo "type nobloat for no hud bloat"
alias "nofog" "exec misc/nofog"; echo "type nofog to disable fog"
alias "norag" "exec misc/norag"; echo "type norag for no ragdolls"
alias "off" "violence_ablood 0; violence_hblood 0; violence_hgibs 0; violence_agibs 0"; echo "type off to turn gibs and blood off"
alias "on" "violence_ablood 1; violence_hblood 1; violence_hgibs 1; violence_agibs 1"; echo "type on to turn gibs and blood on"
alias "ostudablur" "mat_motion_blur_enabled 1; mat_motion_blur_forward_enabled 1; mat_motion_blur_strength 1; mat_motion_blur_falling_intensity 0; mat_motion_blur_falling_min 0; mat_motion_blur_percent_of_screen_max 25; mat_motion_blur_falling_max 0; mat_motion_blur_rotation_intensity 6"; echo "type ostudablur to use ostuda blur settings"
alias "outlinesoff" "glow_outline_effect_enable 0; tf_enable_glows_after_respawn 0; tf_spec_xray_disable 1"; echo "type outlinesoff to turn spawn wh off"
alias "outlineson" "glow_outline_effect_enable 1; tf_enable_glows_after_respawn 1; tf_spec_xray_disable 0"; echo "type outlineson to turn spawn wh on"
alias "trashtalk" "exec misc/trashtalk"; echo "type trashtalk for krazes trashtalk script"
alias "rag" "exec misc/rag"; echo "type rag for ragdolls"
alias "reccfg" "exec misc/rec"; echo "type reccfg for boobsy recording config (C:ffmpeg)
alias "righthand" "cl_flipviewmodels 0"
alias "shineoff" "mat_bumpmap 0; mat_specular 0; mat_phong 0"; echo "type shineoff to turn shine off"
alias "shineon" "mat_bumpmap 1; mat_specular 1; mat_phong 1"; echo "type shineon to turn shine on"
alias "smallhud" "cl_hud_minmode 1"; echo "type smallhud to use hud min-mode"
alias "unfilteredtextures" "mat_filtertextures 0; mat_filterlightmaps 0"; echo "type unfilteredtextures for blocky textures"
alias "vm100" "viewmodel_fov 100"; echo "type vm100 to use 100 viewmodel fov"
alias "vm86" "viewmodel_fov 86"; echo "type vm86 to use 86 viewmodel fov"
alias "vm88" "viewmodel_fov 88"; echo "type vm88 to use 88 viewmodel fov"
alias "vm90" "viewmodel_fov 90"; echo "type vm90 to use 90 viewmodel fov"
alias "vm95" "viewmodel_fov 95"; echo "type vm95 to use 95 viewmodel fov"
alias "xcdblur" "mat_motion_blur_enabled 1; mat_motion_blur_forward_enabled 1; mat_motion_blur_strength 0.9; mat_motion_blur_falling_intensity 0; mat_motion_blur_falling_min 0; mat_motion_blur_percent_of_screen_max 25; mat_motion_blur_falling_max 0; mat_motion_blur_rotation_intensity 5"; echo "type xcdblur to use xcd blur settings"
alias "xhairflash" "exec misc/xhairflashingscript"; echo "type xhairflash for xhairflashingscript"

echo ""
echo ""

alias "back" "exec alias/menu.cfg"; echo "type back to return to the menu"