clear
echo "Viewmodel fov switcher aliases:"
// Viewmodel switcher

alias "45fov" "viewmodel_fov 45;alias upfov 50fov;alias downfov 120fov"; echo "type 45fov to use 45 viewmodel fov"
alias "50fov" "viewmodel_fov 50;alias upfov 55fov;alias downfov 45fov"; echo "type 50fov to use 50 viewmodel fov"
alias "55fov" "viewmodel_fov 55;alias upfov 60fov;alias downfov 50fov"; echo "type 55fov to use 55 viewmodel fov"
alias "60fov" "viewmodel_fov 60;alias upfov 65fov;alias downfov 55fov"; echo "type 60fov to use 60 viewmodel fov"
alias "65fov" "viewmodel_fov 65;alias upfov 70fov;alias downfov 60fov"; echo "type 65fov to use 65 viewmodel fov"
alias "70fov" "viewmodel_fov 70;alias upfov 75fov;alias downfov 65fov"; echo "type 70fov to use 70 viewmodel fov"
alias "75fov" "viewmodel_fov 75;alias upfov 80fov;alias downfov 70fov"; echo "type 75fov to use 75 viewmodel fov"
alias "80fov" "viewmodel_fov 80;alias upfov 85fov;alias downfov 75fov"; echo "type 80fov to use 80 viewmodel fov"
alias "85fov" "viewmodel_fov 85;alias upfov 90fov;alias downfov 80fov"; echo "type 85fov to use 85 viewmodel fov"
alias "90fov" "viewmodel_fov 90;alias upfov 95fov;alias downfov 85fov"; echo "type 90fov to use 90 viewmodel fov"
alias "95fov" "viewmodel_fov 95;alias upfov 100fov;alias downfov 90fov"; echo "type 95fov to use 95 viewmodel fov"
alias "100fov" "viewmodel_fov 100;alias upfov 105fov;alias downfov 95fov"; echo "type 100fov to use 100 viewmodel fov"
alias "105fov" "viewmodel_fov 105;alias upfov 110fov;alias downfov 100fov"; echo "type 105fov to use 105 viewmodel fov"
alias "110fov" "viewmodel_fov 110;alias upfov 115fov;alias downfov 105fov"; echo "type 110fov to use 110 viewmodel fov"
alias "115fov" "viewmodel_fov 115;alias upfov 120fov;alias downfov 110fov"; echo "type 115fov to use 115 viewmodel fov"
alias "120fov" "viewmodel_fov 120;alias upfov 45fov;alias downfov 115fov"; echo "type 120fov to use 120 viewmodel fov"
alias "downfov" "80fov"; echo "type downfov to decrease viewmodel fov"
alias "upfov" "90fov"; echo "type upfov to increase viewmodel fov"

alias "toggleminviewmodels" "incrementvar tf_use_min_viewmodels 0 1 1"; echo "type toggleminviewmodels to toggle minimal viewmodels"
alias "toggleviewmodel" "incrementvar r_drawviewmodel 0 1 1"; echo "type toggleviewmodel to toggle viewmodel visibility"

echo ""
echo ""

alias "back" "exec alias/menu.cfg"; echo "type back to return to the menu"