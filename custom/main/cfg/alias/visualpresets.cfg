clear
echo "Visual preset aliases:"
// Alias presets
alias "kraze" "cr3; green; vm88; 32"; echo "type kraze to use kraze visuals"
alias "maplegfx" "exec misc/maplegfx"; echo "type maplegfx for maple gfx"
alias "xcdgfx" "exec misc/xcdgfx"; echo "type xcdgfx for xcd gfx"
alias "gfx" "exec misc/gfx"; echo "type gfx for low graphics preset"
alias "cinema" "exec misc/cinema"; echo "type cinema for boobsys demo recording gfx"
alias "mcomsverylow" "exec misc/mcoms/presets/very-low"; echo "type mcomsverylow for mastercoms very low preset"
alias "mcomslow" "exec misc/mcoms/presets/low"; echo "type mcomslow for mastercoms low preset"
alias "mcomsmedium" "exec misc/mcoms/presets/medium"; echo "type mcomsmedium for mastercoms medium preset"
alias "mcomsmediumlow" "exec misc/mcoms/presets/medium-low"; echo "type mcomsmediumlow for mastercoms medium low preset"
alias "mcomsmediumhigh" "exec misc/mcoms/presets/medium-high"; echo "type mcomsmediumhigh for mastercoms medium high preset"
alias "mcomshigh" "exec misc/mcoms/presets/high"; echo "type mcomshigh for mastercoms high preset"
alias "mcomsultra" "exec misc/mcoms/presets/ultra"; echo "type mcomsultra for mastercoms ultra preset"
alias "normal" "switcher; white; vm95; 32"; echo "type normal to use gekoh normal visuals"
alias "scriptvis" "cr7; green; vm86; 25.5"; echo "type scriptvis for script visuals"
alias "yakenvis" "cr7; yellow; vm90; 32"; echo "type yaken for yaken visuals"

