alias "k2" "play ui/killsound_electro.wav;tf_dingalingaling_last_effect 1;tf_dingalingaling_lasthit 1"; echo "type k2 for killsound ui/killsound_electro.wav"
alias "k3" "play ui/killsound_note.wav;tf_dingalingaling_last_effect 2;tf_dingalingaling_lasthit 1"; echo "type k3 for killsound ui/killsound_note.wav"
alias "k4" "play ui/killsound_percussion.wav;tf_dingalingaling_last_effect 3;tf_dingalingaling_lasthit 1"; echo "type k4 for killsound ui/killsound_percussion.wav"
alias "k5" "play ui/killsound_retro.wav;tf_dingalingaling_last_effect 4;tf_dingalingaling_lasthit 1"; echo "type k5 for killsound ui/killsound_retro.wav"
alias "k6" "play ui/killsound_space.wav;tf_dingalingaling_last_effect 5;tf_dingalingaling_lasthit 1"; echo "type k6 for killsound ui/killsound_space.wav"
alias "k7" "play ui/killsound_beepo.wav;tf_dingalingaling_last_effect 6;tf_dingalingaling_lasthit 1"; echo "type k7 for killsound ui/killsound_beepo.wav"
alias "k8" "play ui/killsound_vortex.wav;tf_dingalingaling_last_effect 7;tf_dingalingaling_lasthit 1"; echo "type k8 for killsound ui/killsound_vortex.wav"
alias "k9" "play ui/killsound_squasher.wav;tf_dingalingaling_last_effect 8;tf_dingalingaling_lasthit 1"; echo "type k9 for killsound ui/killsound_squasher.wav"

echo ""
echo ""

alias "back" "exec alias/menu.cfg"; echo "type back to return to the menu"