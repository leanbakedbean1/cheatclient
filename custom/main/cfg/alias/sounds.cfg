clear
echo "Hitsound and Killsound aliases:"
// Hitsounds / Killsounds
alias "34" "tf_dingaling_pitchmindmg 100; tf_dingaling_pitchmaxdmg 34"; echo "type 34 for dingaling pitch min 100 max 34"
alias "50" "tf_dingaling_pitchmindmg 100; tf_dingaling_pitchmaxdmg 50"; echo "type 50 for dingaling pitch min 100 max 50"
alias "100" "tf_dingaling_pitchmindmg 100; tf_dingaling_pitchmaxdmg 100"; echo "type 100 for dingaling pitch 100"
alias "125" "tf_dingaling_pitchmindmg 75; tf_dingaling_pitchmaxdmg 125"; echo "type 75 for dingaling pitch min 75 max 125"
alias "130" "tf_dingaling_pitchmindmg 130; tf_dingaling_pitchmaxdmg 130"; echo "type 130 for dingaling pitch 130"
alias "150" "tf_dingaling_pitchmindmg 100; tf_dingaling_pitchmaxdmg 150"; echo "type 100 for dingaling pitch min 100 max 150"
alias "200" "tf_dingaling_pitchmindmg 100; tf_dingaling_pitchmaxdmg 200"; echo "type 200 for dingaling pitch min 100 max 200"

echo ""
echo ""

alias "h0" "tf_dingalingaling 0"; echo "type h0 to disable hitsound"
alias "h1" "play ui/hitsound.wav;tf_dingalingaling_effect 0;tf_dingalingaling 1"; echo "type h1 for hitsound ui/hitsound.wav"
alias "h2" "play ui/hitsound_electro.wav;tf_dingalingaling_effect 1;tf_dingalingaling 1"; echo "type h2 for hitsound ui/hitsound_electro.wav"
alias "h3" "play ui/hitsound_menu_note.wav;tf_dingalingaling_effect 2;tf_dingalingaling 1"; echo "type h3 for hitsound ui/hitsound_menu_note.wav"
alias "h4" "play ui/hitsound_percussion.wav;tf_dingalingaling_effect 3;tf_dingalingaling 1"; echo "type h4 for hitsound ui/hitsound_percussion.wav"
alias "h5" "play ui/hitsound_retro.wav;tf_dingalingaling_effect 4;tf_dingalingaling 1"; echo "type h5 for hitsound ui/hitsound_retro.wav"
alias "h6" "play ui/hitsound_space.wav;tf_dingalingaling_effect 5;tf_dingalingaling 1"; echo "type h6 for hitsound ui/hitsound_space.wav"
alias "h7" "play ui/hitsound_beepo.wav;tf_dingalingaling_effect 6;tf_dingalingaling 1"; echo "type h7 for hitsound ui/hitsound_beepo.wav"
alias "h8" "play ui/hitsound_vortex.wav;tf_dingalingaling_effect 7;tf_dingalingaling 1"; echo "type h8 for hitsound ui/hitsound_vortex.wav"
alias "h9" "play ui/hitsound_squasher.wav;tf_dingalingaling_effect 8;tf_dingalingaling 1"; echo "type h9 for hitsound ui/hitsound_squasher.wav"

echo ""
echo ""

alias "k0" "tf_dingalingaling_lasthit 0"; echo "type k0 to disable last-hit killsound"
