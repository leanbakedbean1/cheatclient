clear
echo "Mouse aliases:"
// mouse settings
alias "m0" "m_rawinput 0; m_mouseaccel1 0; m_mouseaccel2 0; m_mousespeed 0"; echo "type m0 for raw input off, mouse accel off, and mouse speed 0"
alias "m1" "m_rawinput 1; m_mouseaccel1 0; m_mouseaccel2 0; m_mousespeed 0"; echo "type m1 for raw input on, mouse accel off, and mouse speed 0"
alias "m2" "m_rawinput 1; m_mouseaccel1 1; m_mouseaccel2 1; m_mousespeed 0"; echo "type m2 for raw input on, mouse accel on, and mouse speed 0"

echo ""
echo ""

alias "back" "exec alias/menu.cfg"; echo "type back to return to the menu"