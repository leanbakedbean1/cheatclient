clear
echo "Crosshair color and style aliases:"
// Crosshairs
alias "25.5" "cl_crosshair_scale 25.5"; echo "type 25.5 to use xhair scale 25.5"
alias "32" "cl_crosshair_scale 32"; echo "type 32 for xhair scale 32"
alias "40" "cl_crosshair_scale 40"; echo "type 40 for xhair scale 40"
alias "black" "cl_crosshair_red 0; cl_crosshair_green 0; cl_crosshair_blue 0"; echo "type black for black xhair"
alias "blue" "cl_crosshair_red 0; cl_crosshair_green 0; cl_crosshair_blue 255"; echo "type blue for blue xhair"
alias "green" "cl_crosshair_red 0; cl_crosshair_green 255; cl_crosshair_blue 0"; echo "type green for green xhair"
alias "pink" "cl_crosshair_red 255; cl_crosshair_green 0; cl_crosshair_blue 255"; echo "type pink for pink xhair"
alias "red" "cl_crosshair_red 255; cl_crosshair_green 0; cl_crosshair_blue 0"; echo "type red for red xhair"
alias "white" "cl_crosshair_red 255; cl_crosshair_green 255; cl_crosshair_blue 255"; echo "type white for white xhair"
alias "yellow" "cl_crosshair_red 255; cl_crosshair_green 255; cl_crosshair_blue 0"; echo "type yellow for yellow xhair"
alias "nocross" "crosshair 0"; echo "type nocross to turn off xhair"
alias "cross" "crosshair 1"; echo "type cross to turn on xhair"
alias "cr3" "cl_crosshair_file crosshair3"; echo "type cr3 for cr3"
alias "cr5" "cl_crosshair_file crosshair5"; echo "type cr5 for cr5"
alias "cr6" "cl_crosshair_file crosshair6"; echo "type cr6 for cr6"
alias "cr7" "cl_crosshair_file crosshair7"; echo "type cr7 for cr7"

echo ""
echo ""

alias "back" "exec alias/menu.cfg"; echo "type back to return to the menu"