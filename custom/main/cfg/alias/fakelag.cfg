// Fake Lag Switch Bind
alias "fakelagjitter" "sdr sdr FakePacketLag_Send 250; sdr FakePacketLag_Recv 250; echo fakelag on jitter!"
alias "nofakelag" "sdr FakePacketLag_Send 15; sdr FakePacketLag_Recv 15; bind - fakelag15; echo fakelag off!"

alias "lag_off" "nofakelag; alias toggle_lag lag_on"
alias "lag_on" "fakelagjitter; alias toggle_lag lag_off"
alias "toggle_lag" "lag_on"

alias "+lag_on" "fakelagjitter"
alias "-lag_on" "nofakelag"

alias "+peek_desync" "sdr FakePacketLag_Send 40; sdr FakePacketJitter_Send_Max 50; sdr FakePacketLoss_Send 5"
alias "-peek_desync" "sdr FakePacketLag_Send 0; sdr FakePacketJitter_Send_Max 0; sdr FakePacketLoss_Send 0"

// Fake Lag Toggle Bind Cylce
alias "fakelag15" "sdr FakePacketJitter_Send_max 0; sdr FakePacketJitter_Send_Avg 0; sdr FakePacketLag_Send 5; sdr FakePacketLag_Recv 10; bind [ fakelag15loss; echo fakelag on 15!"
alias "fakelag15loss" "sdr FakePacketJitter_Send_max 60; sdr FakePacketJitter_Send_Avg 10; sdr FakePacketLag_Send 5; sdr FakePacketLag_Recv 10; bind [ fakelag30; echo fakelag on 15 with loss!"
alias "fakelag30" "sdr FakePacketJitter_Send_max 0; sdr FakePacketJitter_Send_Avg 0; sdr FakePacketLag_Send 15; sdr FakePacketLag_Recv 15; bind [ fakelag30loss; echo fakelag on 30!"
alias "fakelag30loss" "sdr FakePacketJitter_Send_max 60; sdr FakePacketJitter_Send_Avg 10; sdr FakePacketLag_Send 15; sdr FakePacketLag_Recv 15; bind [ fakelag50; echo fakelag on 30 with loss!"
alias "fakelag50" "sdr FakePacketJitter_Send_max 0; sdr FakePacketJitter_Send_Avg 0; sdr FakePacketLag_Send 25; sdr FakePacketLag_Recv 25; bind [ fakelag50loss; echo fakelag on 50!"
alias "fakelag50loss" "sdr FakePacketJitter_Send_max 60; sdr FakePacketJitter_Send_Avg 10; sdr FakePacketLag_Send 25; sdr FakePacketLag_Recv 25; bind [ nofakelag1; echo fakelag on 50 with loss!"
alias "nofakelag1" "sdr FakePacketJitter_Send_max 0; sdr FakePacketJitter_Send_Avg 0; sdr FakePacketLag_Send 0; sdr FakePacketLag_Recv 0; bind [ fakelag15; echo fakelag off!"

alias "fakelagcycle" "fakelag15"
alias "resetfakelag" "nofakelag1"