alias optimal_lerp "cl_interp_ratio 0; cl_interp 0.023; setinfo cl_interp 0.023"

// overrides comfig aliases
alias interp_standard_safe optimal_lerp
alias interp_congestion_low optimal_lerp
alias interp_max_high optimal_lerp
alias snapshot_buffer_safe optimal_lerp
alias snapshot_buffer_high optimal_lerp

cl_lagcompensation 1
net_maxpacketdrop 0
net_compresspackets 1
net_compresspackets_minsize 200
net_maxroutable 1200
net_maxfragments 1200
rate 786432
net_splitpacket_maxrate 196608 // this in bytes
net_splitrate 1 // 2 might be better for unstable internet
net_maxcleartime 0.001
net_maxfilesize 64

// having this set to 1 seems unnecessary
cl_setupallbones 0

// engine prediction stuff
cl_pred_optimize 2
cl_smooth 0
cl_smoothtime 0.03

cl_movehelper_process 1
cl_movehelper_process_vel 1
cl_movehelper_process_imp 1

cl_pred_doresetlatch 0 // keep this at 0 

alias whatnet "echo exordium"