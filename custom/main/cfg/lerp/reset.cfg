echo "Resetting TF2 interpolation and network settings to defaults:"

// Interpolation and client update rates.
cl_interp 0.1; echo "cl_interp reset to 0.1"
cl_interp_ratio 2; echo "cl_interp_ratio reset to 2"
cl_updaterate 20; echo "cl_updaterate reset to 20"
cl_cmdrate 30; echo "cl_cmdrate reset to 30"
rate 30000; echo "rate reset to 30000"

// Prediction and smoothing.
cl_lagcompensation 1; echo "cl_lagcompensation reset to 1"
cl_predict 1; echo "cl_predict reset to 1"
cl_pred_optimize 2; echo "cl_pred_optimize reset to 2"
cl_smooth 1; echo "cl_smooth reset to 1"
cl_smoothtime 0.1; echo "cl_smoothtime reset to 0.1"

// Network transport defaults used by the lerp profiles.
cl_setupallbones 1; echo "cl_setupallbones reset to 1"
net_maxpacketdrop 1000; echo "net_maxpacketdrop reset to 1000"
hud_escort_interp 0.1; echo "hud_escort_interp reset to 0.1"
net_compresspackets 1; echo "net_compresspackets reset to 1"
net_compresspackets_minsize 128; echo "net_compresspackets_minsize reset to 128"
net_maxroutable 1260; echo "net_maxroutable reset to 1260"
net_maxfragments 1260; echo "net_maxfragments reset to 1260"
net_splitpacket_maxrate 30000; echo "net_splitpacket_maxrate reset to 30000"
net_splitrate 1; echo "net_splitrate reset to 1"
net_maxcleartime 4.0; echo "net_maxcleartime reset to 4.0"
net_maxfilesize 16; echo "net_maxfilesize reset to 16"

echo "TF2 interpolation and network settings reset."
alias whatnet "echo reset"