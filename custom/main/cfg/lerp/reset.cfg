// Interpolation and client update rates.
cl_interp 0.1
cl_interp_ratio 2
cl_updaterate 20
cl_cmdrate 30
rate 30000

// Prediction and smoothing.
cl_lagcompensation 1
cl_predict 1
cl_pred_optimize 2
cl_smooth 1
cl_smoothtime 0.1

// Network transport defaults used by the lerp profiles.
cl_setupallbones 1
net_maxpacketdrop 1000
hud_escort_interp 0.1
net_compresspackets 1
net_compresspackets_minsize 128
net_maxroutable 1260
net_maxfragments 1260
net_splitpacket_maxrate 30000
net_splitrate 1
net_maxcleartime 4.0
net_maxfilesize 16

alias whatnet "echo default"